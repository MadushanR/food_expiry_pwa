<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151713" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FreshCheck">
  <meta name="description" content="A private, offline food expiry tracker.">
  <title>FreshCheck</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-lockup">
        <img class="app-logo" src="./icons/logo.png" width="52" height="52" alt="">
        <div><p class="eyebrow">Your kitchen</p><h1>FreshCheck</h1></div>
      </div>
      <button class="icon-button" id="dataButton" type="button" aria-label="Backup and restore" title="Backup and restore"><span aria-hidden="true">•••</span></button>
    </header>
    <main>
      <section class="summary" aria-label="Food summary">
        <button class="summary-card danger" type="button" data-filter="expired"><strong id="expiredCount">0</strong><span>Expired</span></button>
        <button class="summary-card warning" type="button" data-filter="soon"><strong id="soonCount">0</strong><span>Use soon</span></button>
        <button class="summary-card" type="button" data-filter="active"><strong id="totalCount">0</strong><span>In kitchen</span></button>
      </section>
      <section class="inventory" aria-labelledby="inventoryHeading">
        <div class="section-heading">
          <div><p class="eyebrow">Inventory</p><h2 id="inventoryHeading">What to use next</h2></div>
          <button class="primary-button" id="addButton" type="button">Add food</button>
        </div>
        <div class="toolbar">
          <label class="search-field"><span class="sr-only">Search food</span><input id="searchInput" type="search" placeholder="Search food" autocomplete="off"></label>
          <label><span class="sr-only">Filter inventory</span><select id="filterSelect"><option value="active">Active</option><option value="expired">Expired</option><option value="soon">Use soon</option><option value="used">Used</option><option value="all">Everything</option></select></label>
          <label><span class="sr-only">Sort inventory</span><select id="sortSelect"><option value="expiry">Expiry date</option><option value="name">Name</option><option value="recent">Recently added</option></select></label>
        </div>
        <div id="inventoryGroups" class="inventory-groups" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <dialog id="itemDialog" class="app-dialog">
    <form id="itemForm">
      <div class="dialog-header">
        <div><p class="eyebrow" id="formEyebrow">New item</p><h2 id="formTitle">Add food</h2></div>
        <button class="icon-button close-button" id="closeItemButton" type="button" aria-label="Close">×</button>
      </div>
      <input type="hidden" id="itemId">
      <label class="field full-width"><span>Food name</span><input id="itemName" type="text" required maxlength="80" autocomplete="off" placeholder="e.g. Greek yogurt"></label>
      <div class="form-grid">
        <label class="field"><span>Expiry date</span><input id="expiryDate" type="date" required></label>
        <label class="field"><span>Storage</span><select id="location"><option>Fridge</option><option>Freezer</option><option>Pantry</option><option>Counter</option><option>Other</option></select></label>
        <label class="field"><span>Quantity</span><input id="quantity" type="number" inputmode="decimal" min="0" step="any" placeholder="1"></label>
        <label class="field"><span>Unit</span><input id="unit" type="text" maxlength="24" placeholder="pack, kg, bottle"></label>
      </div>
      <div class="date-shortcuts" aria-label="Expiry date shortcuts">
        <button type="button" class="chip" data-days="3">+3 days</button><button type="button" class="chip" data-days="7">+1 week</button><button type="button" class="chip" data-days="14">+2 weeks</button><button type="button" class="chip" data-days="30">+1 month</button>
      </div>
      <label class="field full-width"><span>Notes <small>optional</small></span><textarea id="notes" rows="2" maxlength="240" placeholder="Opened on Monday, top shelf…"></textarea></label>
      <div class="scan-row">
        <button class="secondary-button" id="scanButton" type="button">Scan a date</button>
        <input id="imageInput" type="file" accept="image/*" capture="environment" hidden>
        <span id="ocrStatus" class="helper-text" aria-live="polite"></span>
      </div>
      <p id="formError" class="form-error" role="alert"></p>
      <div class="dialog-actions"><button class="secondary-button" type="button" id="cancelItemButton">Cancel</button><button class="primary-button" type="submit">Save item</button></div>
    </form>
  </dialog>

  <dialog id="dataDialog" class="app-dialog compact-dialog">
    <div class="dialog-header"><div><p class="eyebrow">Your data</p><h2>Backup and restore</h2></div><button class="icon-button close-button" id="closeDataButton" type="button" aria-label="Close">×</button></div>
    <p class="dialog-copy">Your inventory stays on this device. Download a backup occasionally so it can be restored if Safari data is cleared or your phone is replaced.</p>
    <div class="data-actions"><button class="primary-button" id="exportButton" type="button">Download backup</button><button class="secondary-button" id="importButton" type="button">Restore backup</button><input id="importInput" type="file" accept="application/json,.json" hidden></div>
    <p class="helper-text" id="dataStatus" aria-live="polite"></p>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden><span id="toastMessage"></span><button id="undoButton" type="button">Undo</button></div>
  <div id="updateBanner" class="update-banner" hidden><span>A fresh version is ready.</span><button id="updateButton" type="button">Update</button></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
